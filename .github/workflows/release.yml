name: Release

# Every push to main publishes/refreshes a rolling `nightly` prerelease.
# Pushing a `v*` tag publishes a permanent release for that version.
# Pull requests build and test only — they never publish.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # A release build carries no debug info, so keep incremental off for speed.
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: rdpio.exe
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: rdpio

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
          rustup default stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ matrix.name }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.name }}-cargo-

      # The protocol crates are sans-I/O and test on both platforms. On Linux
      # the client builds headless (see PORTING.md), so its Windows-only
      # modules are cfg'd out and simply aren't covered there.
      - name: Test
        run: cargo test --workspace --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p rdp-client --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          staging="rdpio-${{ matrix.name }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$staging/"
          cp README.md "$staging/"
          tar -czf "$staging.tar.gz" "$staging"
          sha256sum "$staging.tar.gz" > "$staging.tar.gz.sha256"

      # A release tag must name the version the build carries (what updates
      # compare): v0.3.0 for version = "0.3.0" in Cargo.toml.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(grep -m1 -A3 '^\[workspace.package\]' Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p')
          if [[ "v$version" != "${GITHUB_REF#refs/tags/}" ]]; then
            echo "::error::tag ${GITHUB_REF#refs/tags/} but Cargo.toml says $version"; exit 1
          fi

      # Authenticode: Windows shows the verified publisher (no SmartScreen
      # "unknown publisher" warning, a verified UAC prompt). Azure Artifact
      # Signing, set up with the repository variables ARTIFACT_SIGNING_ENDPOINT,
      # ARTIFACT_SIGNING_ACCOUNT and ARTIFACT_SIGNING_PROFILE and the secrets
      # AZURE_TENANT_ID, AZURE_CLIENT_ID and AZURE_CLIENT_SECRET. Until then
      # (and on pull requests) the exe goes out unsigned. Before the update
      # manifest below: that hashes the exe as published.
      - name: Check for Authenticode signing
        id: authenticode
        if: runner.os == 'Windows'
        shell: bash
        env:
          HAS_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          HAS_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT != '' }}
        run: |
          if [[ "$HAS_SECRET" == "true" && "$HAS_ACCOUNT" == "true" && "${{ github.event_name }}" != "pull_request" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.event_name }}" != "pull_request" ]]; then
              echo "::warning::Authenticode signing isn't set up (see docs/signing.md): rdpio.exe goes out unsigned"
            fi
          fi

      - name: Authenticode-sign rdpio.exe
        if: steps.authenticode.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          files: ${{ github.workspace }}\target\${{ matrix.target }}\release\${{ matrix.bin }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check the Authenticode signature
        if: steps.authenticode.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "target/${{ matrix.target }}/release/${{ matrix.bin }}"
          if ($sig.Status -ne 'Valid') { Write-Output "::error::rdpio.exe signature: $($sig.Status) $($sig.StatusMessage)"; exit 1 }
          Write-Output "Signed by: $($sig.SignerCertificate.Subject)"

      # The update manifest (rdpio.exe.update): version, build, hash and
      # protocols, signed with the release key. rdpio installs an update —
      # from GitHub or handed over by a host — only with a valid one.
      - name: Sign (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RDPIO_SIGNING_KEY: ${{ secrets.RDPIO_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "target/${{ matrix.target }}/release/${{ matrix.bin }}"
          if (-not $env:RDPIO_SIGNING_KEY) {
            if ("${{ github.event_name }}" -ne 'pull_request') { Write-Output "::error::RDPIO_SIGNING_KEY isn't set: releases can't update anyone"; exit 1 }
            Write-Output "No signing key on a pull request: unsigned build"; exit 0
          }
          & $exe --release-sign $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = "rdpio-${{ matrix.name }}"
          $exe = "target/${{ matrix.target }}/release/${{ matrix.bin }}"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item $exe $staging
          Copy-Item README.md $staging
          # The exe and its manifest on their own too: what updates download.
          if (Test-Path "$exe.update") {
            Copy-Item "$exe.update" $staging
            Copy-Item $exe rdpio.exe
            Copy-Item "$exe.update" rdpio.exe.update
          }
          Compress-Archive -Path $staging -DestinationPath "$staging.zip" -Force
          (Get-FileHash "$staging.zip" -Algorithm SHA256).Hash.ToLower() + "  $staging.zip" |
            Out-File -Encoding ascii "$staging.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdpio-${{ matrix.name }}
          path: |
            rdpio-${{ matrix.name }}.tar.gz*
            rdpio-${{ matrix.name }}.zip*
            rdpio.exe
            rdpio.exe.update
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Never publish from a pull request.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            title="rdpio ${tag#v}"
            flags=(--latest)
            notes="Release $tag (${GITHUB_SHA:0:7})."
          else
            tag="nightly"
            title="Nightly build"
            flags=(--prerelease)
            notes="Rolling build of \`main\` at ${GITHUB_SHA:0:7}. Replaced on every push."
            # Move the rolling tag to this commit: drop the old release and tag
            # first, otherwise the release would keep pointing at the old commit.
            gh release delete "$tag" --cleanup-tag --yes || true
          fi

          # Hand-written notes for a release, when there are some.
          notes_file="docs/releases/$tag.md"
          if [[ ! -f "$notes_file" ]]; then
            notes_file=$(mktemp)
            printf '%s\n' "$notes" > "$notes_file"
          fi

          gh release create "$tag" dist/* \
            --title "$title" \
            --notes-file "$notes_file" \
            --target "$GITHUB_SHA" \
            "${flags[@]}"
