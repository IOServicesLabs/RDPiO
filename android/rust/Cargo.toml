[package]
name = "rdpio-android"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "rdpio for Android: the Hyper Accelerator and Windows 365 client (the app's JNI core)"
publish = false

# Its own workspace: built only for Android (by cargo-ndk, from Gradle), never
# with the desktop workspace.
[workspace]

[lib]
name = "rdpio"
crate-type = ["cdylib"]

[dependencies]
rdp-hyper = { path = "../../crates/rdp-hyper" }
# Windows 365 / RDP: the desktop client's protocol crates, and its session
# stack compiled in from crates/rdp-client/src (see src/lib.rs).
rdp-asn1 = { path = "../../crates/rdp-asn1" }
rdp-core = { path = "../../crates/rdp-core" }
rdp-pdu = { path = "../../crates/rdp-pdu" }
rdp-crypto = { path = "../../crates/rdp-crypto" }
rdp-channels = { path = "../../crates/rdp-channels" }
rdp-graphics = { path = "../../crates/rdp-graphics" }
rdp-nla = { path = "../../crates/rdp-nla" }
thiserror = "1.0"
tracing = { version = "0.1", features = ["log"] }
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
url = "2.5"
http = "1.0"
rustls = "0.23"
rustls-pki-types = "1"
webpki-roots = "0.26"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
jni = "0.21"
# MediaCodec (hardware video decode onto the screen's Surface) and AAudio.
ndk = { version = "0.9", features = ["media", "audio", "api-level-30"] }
# libopus, built from source with CMake (see android/build-rust.sh for the env).
opus = "0.3"
libc = "0.2"
log = "0.4"
android_logger = "0.14"

[profile.release]
opt-level = 3
# Fat: one LLVM module for the whole core, so the protocol crates' hot paths
# (rdp-hyper's reassembly, FEC, AEAD calls) inline across crates. Slower to
# link; the target features are in .cargo/config.toml.
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
