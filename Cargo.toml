[workspace]
resolver = "2"
members = [
    "crates/rdp-asn1",
    "crates/rdp-crypto",
    "crates/rdp-pdu",
    "crates/rdp-core",
    "crates/rdp-nla",
    "crates/rdp-channels",
    "crates/rdp-graphics",
    "crates/rdp-gpu",
    "crates/rdp-client",
    "crates/rdp-webrtc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT OR Apache-2.0"
repository = "https://github.com/IOServicesLabs/RDPiO"
description = "GPU-accelerated RDP client in Rust"

[workspace.dependencies]
# Internal crates
rdp-asn1 = { path = "crates/rdp-asn1", version = "0.1.0" }
rdp-crypto = { path = "crates/rdp-crypto", version = "0.1.0" }
rdp-pdu = { path = "crates/rdp-pdu", version = "0.1.0" }
rdp-core = { path = "crates/rdp-core", version = "0.1.0" }
rdp-nla = { path = "crates/rdp-nla", version = "0.1.0" }
rdp-channels = { path = "crates/rdp-channels", version = "0.1.0" }
rdp-graphics = { path = "crates/rdp-graphics", version = "0.1.0" }
rdp-gpu = { path = "crates/rdp-gpu", version = "0.1.0" }

# Third-party, pure and cross-platform
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
byteorder = "1.5"
bitflags = "2.6"
wide = "0.7"
ureq = { version = "2.10", features = ["json"] }
# Allocator. The default on Windows is HeapAlloc, whose per-heap lock is
# contended across our network / decode / UI threads, and the tile codecs
# allocate a buffer per tile — hundreds per frame. mimalloc's per-thread free
# lists take that contention off the hot path.
mimalloc = "0.1"
serde_json = "1.0"
# Hub model/store: serde-derive for the connection/MRU records, uuid v4 ids
# (+serde so ConnectionRecord::id round-trips through JSON), base64 for the
# ProtectedPassword blob encoding. All three already exist in Cargo.lock as
# transitive deps, so promoting them to direct workspace deps adds no new tree.
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
url = "2.5"
http = "1.0"
webview2-com = "0.39" # uses windows ^0.62 — matches the workspace windows below

# Microsoft OS bindings. Only the windows-gated crates (rdp-nla, rdp-gpu,
# rdp-client) enable this; each opts into the exact feature modules it needs.
# Must match the `windows` version webview2-com pulls, so the WebView2 COM
# types (ICoreWebView2*, HWND params) unify into a single `windows` crate.
[workspace.dependencies.windows]
version = "0.62"
default-features = false

[profile.release]
opt-level = 3
# One codegen unit per crate lets LLVM see each whole crate at once, which is
# what lets it inline and vectorise the per-pixel hot loops (YUV conversion,
# ClearCodec, progressive RLGR). Costs build time (~20s → ~42s), not runtime.
#
# NOTE: `lto` is deliberately NOT set. Both `lto = "fat"` and `lto = "thin"`
# crash rustc on this dependency set — fat with STATUS_ACCESS_VIOLATION building
# `webrtc`, thin with STATUS_STACK_BUFFER_OVERRUN linking `rdpio`. Worth
# retrying on a future toolchain; it would mainly buy cross-crate inlining
# between rdp-graphics and rdp-client.
codegen-units = 1
panic = "abort"

# webrtc-rs' DTLS picked its signature verifier from the hash alone (ECDSA
# SHA-256 → P-256, SHA-384 → P-384; no RSA SHA-384 below 2048 bits), so a Teams
# media server whose certificate key didn't fit that guess failed every call's
# DTLS handshake with `ring::error::Unspecified`. The vendored copy verifies by
# the certificate's actual key — see `verify_signature` in
# vendor/dtls/src/crypto/mod.rs (the only change, plus its tests).
[patch.crates-io]
dtls = { path = "vendor/dtls" }
# LiveKit's libwebrtc bindings (the `libwebrtc` engine of rdp-webrtc), plus
# `RtpTransceiver::set_direction` and `PeerConnection::get_stats_json`, which the
# Teams protocol needs and the published crate doesn't expose.
libwebrtc = { path = "vendor/libwebrtc" }
# Its C++ glue, patched to request max-bundle/rtcp-mux like Teams' own config.
webrtc-sys = { path = "vendor/webrtc-sys" }
